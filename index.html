<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f4c81" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MIDECS" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="MIDECS 체질 진단 - 나의 비만 원인을 6가지 체질로 정밀 분석" />
  <meta property="og:title" content="MIDECS 체질 진단 설문지" />
  <meta property="og:description" content="나의 비만 원인을 6가지 체질(대사·도파민·장·염증·수면·근육)으로 분석합니다." />
  <title>MIDECS 체질 진단</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
    body{font-family:'Pretendard Variable','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;background:#f0f4fa;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#0c1929,#1e3a5f,#0f4c81);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
    #splash.hide{opacity:0;pointer-events:none}
    #splash h1{color:#fff;font-size:32px;font-weight:800;letter-spacing:.08em}
    #splash p{color:rgba(186,210,240,.7);font-size:14px;margin-top:12px}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    #splash .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#38bdf8;margin:24px 4px 0;animation:pulse 1.2s ease infinite}
    #splash .dot:nth-child(2){animation-delay:.2s}
    #splash .dot:nth-child(3){animation-delay:.4s}
  </style>
</head>
<body>
  <div id="splash"><h1>MIDECS</h1><p>체질 진단 설문지</p><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
